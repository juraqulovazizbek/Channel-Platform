# Upstream Django application server
upstream django_app {
    server web:8000 fail_timeout=5s max_fails=3;
    keepalive 32;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
# Defined in http context — referenced in server blocks below.
# Using $binary_remote_addr saves memory vs $remote_addr.

limit_req_zone $binary_remote_addr
    zone=api_general:10m rate=60r/m;

limit_req_zone $binary_remote_addr
    zone=webhook:10m rate=120r/m;

limit_req_zone $binary_remote_addr
    zone=auth:10m rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Allow ACME challenge (Let's Encrypt cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:50m;
    ssl_session_tickets  off;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS — 1 year, include subdomains, preload
    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── General config ────────────────────────────────────────────────────────
    client_max_body_size  50M;
    keepalive_timeout     65;

    # Gzip compression for API responses
    gzip              on;
    gzip_types        application/json text/plain application/javascript;
    gzip_min_length   1000;
    gzip_comp_level   5;
    gzip_vary         on;

    # ── Telegram bot webhook ──────────────────────────────────────────────────
    # Separate location with its own rate limit and timeout settings.
    # Must not buffer — Telegram expects fast acknowledgement.
    location /bot/webhook/ {
        limit_req zone=webhook burst=20 nodelay;

        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # Critical: forward the Telegram secret token header
        proxy_set_header   X-Telegram-Bot-Api-Secret-Token
            $http_x_telegram_bot_api_secret_token;

        proxy_read_timeout  10s;
        proxy_send_timeout  10s;
        proxy_buffering     off;
        proxy_request_buffering off;
    }

    # ── Auth endpoints — strict rate limit ───────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── General API ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Cache GET responses for 10 seconds at the proxy level
        # Fine-grained cache control is in DRF views
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale error timeout updating;
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    # IP whitelist for admin — uncomment and set your office IP
    # allow 203.0.113.0/24;
    # deny all;
    location /admin/ {
        proxy_pass         http://django_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static files ─────────────────────────────────────────────────────────
    # Served directly by Nginx — zero application overhead.
    location /static/ {
        alias       /app/staticfiles/;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        access_log  off;

        # Security: do not execute anything in /static/
        location ~* \.(php|py|sh|pl)$ {
            deny all;
        }
    }

    # ── Media files ───────────────────────────────────────────────────────────
    # In production these are served from S3 — this block only applies
    # if you're serving media from the local filesystem.
    location /media/ {
        alias       /app/media/;
        expires     7d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── Health checks ─────────────────────────────────────────────────────────
    location /bot/health/ {
        proxy_pass  http://django_app;
        access_log  off;
    }

    # ── Block common exploit paths ────────────────────────────────────────────
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log  off;
        log_not_found off;
    }
}