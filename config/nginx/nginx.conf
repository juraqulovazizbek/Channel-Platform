upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS in production
    # Uncomment when SSL is configured:
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Bot webhook — higher body size, no buffering
    location /bot/webhook/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward Telegram's secret token header
        proxy_set_header X-Telegram-Bot-Api-Secret-Token
            $http_x_telegram_bot_api_secret_token;

        proxy_read_timeout  10s;
        proxy_send_timeout  10s;
        proxy_buffering     off;
    }

    # API routes
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files served directly by Nginx — zero Django overhead
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Health check — no proxy overhead
    location /bot/health/ {
        proxy_pass http://django;
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}