; Supervisor configuration for non-Docker deployments (VPS / bare metal).
; For Docker deployments, process management is handled by docker-compose.

[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
user=appuser

; ── Gunicorn (Django) ─────────────────────────────────────────────────────────

[program:gunicorn]
command=/home/appuser/venv/bin/gunicorn core.wsgi:application
    --bind 127.0.0.1:8000
    --workers 4
    --worker-class sync
    --timeout 60
    --keep-alive 5
    --max-requests 1000
    --max-requests-jitter 100
    --log-level info
    --access-logfile /var/log/gunicorn/access.log
    --error-logfile /var/log/gunicorn/error.log

directory=/home/appuser/app
user=appuser
environment=DJANGO_SETTINGS_MODULE="core.settings.production"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/gunicorn.log
stderr_logfile=/var/log/supervisor/gunicorn_error.log

; ── Celery worker ─────────────────────────────────────────────────────────────

[program:celery_worker]
command=/home/appuser/venv/bin/celery -A core worker
    --loglevel=info
    --concurrency=4
    --max-tasks-per-child=100
    --without-gossip
    --without-mingle
    -Q celery,media,analytics

directory=/home/appuser/app
user=appuser
environment=DJANGO_SETTINGS_MODULE="core.settings.production"
autostart=true
autorestart=true
startretries=5
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/celery_worker.log
stderr_logfile=/var/log/supervisor/celery_worker_error.log
killasgroup=true
stopasgroup=true

; ── Celery beat ───────────────────────────────────────────────────────────────

[program:celery_beat]
command=/home/appuser/venv/bin/celery -A core beat
    --loglevel=info
    --scheduler django_celery_beat.schedulers:DatabaseScheduler

directory=/home/appuser/app
user=appuser
environment=DJANGO_SETTINGS_MODULE="core.settings.production"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/supervisor/celery_beat.log
stderr_logfile=/var/log/supervisor/celery_beat_error.log

[group:telegram_platform]
programs=gunicorn,celery_worker,celery_beat