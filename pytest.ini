[pytest]
DJANGO_SETTINGS_MODULE = core.settings.testing
python_files = tests/test_*.py apps/*/tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --reuse-db
    -p no:warnings
markers =
    slow: marks tests as slow (skipped in fast CI runs)
    integration: marks tests that require external services