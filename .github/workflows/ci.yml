name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: core.settings.testing

jobs:

  # ── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: black (format check)
        run: black --check .

      - name: isort (import order)
        run: isort --check-only .

      - name: flake8 (style)
        run: flake8 .

      - name: mypy (type check)
        run: mypy apps/ services/ tasks/ utils/ --ignore-missing-imports

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-test-secret-key-not-used-in-production
      TELEGRAM_BOT_TOKEN: 0000000000:test-token
      TELEGRAM_WEBHOOK_SECRET: test-secret
      TELEGRAM_WEBHOOK_URL: https://example.com/bot/webhook/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --settings=core.settings.testing

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --tb=short \
            --cov=apps \
            --cov=services \
            --cov=tasks \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Security scan ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety pip-audit

      - name: bandit (code security)
        run: bandit -r apps/ services/ tasks/ utils/ -ll

      - name: safety (dependency vulnerabilities)
        run: safety check -r requirements.txt

      - name: pip-audit (CVE check)
        run: pip-audit -r requirements.txt

  # ── Django system check ───────────────────────────────────────────────────────
  django-check:
    name: Django --check --deploy
    runs-on: ubuntu-latest
    needs: test
    env:
      DJANGO_SECRET_KEY: a-sufficiently-long-secret-key-for-deploy-check-only
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/checkdb
      REDIS_URL: redis://localhost:6379/0
      DJANGO_ALLOWED_HOSTS: example.com
      TELEGRAM_BOT_TOKEN: 0000000000:checktoken
      TELEGRAM_WEBHOOK_SECRET: checksecret
      TELEGRAM_WEBHOOK_URL: https://example.com/bot/webhook/
      AWS_ACCESS_KEY_ID: checkkey
      AWS_SECRET_ACCESS_KEY: checksecret
      AWS_STORAGE_BUCKET_NAME: checkbucket
      CORS_ALLOWED_ORIGINS: https://example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django deploy check
        run: >
          python manage.py check
          --deploy
          --settings=core.settings.production
          --fail-level WARNING

  # ── Build Docker image ────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.celery
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/celery:latest
            ghcr.io/${{ github.repository }}/celery:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max